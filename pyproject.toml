[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megaton-shield"
version = "1.0.0"
description = "Three-Stage RAG Integrity Shield"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
